name: Build Chess Assistant

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'

      - name: Clone Rodent V
        run: |
          git clone --depth 1 https://github.com/nescitus/Rodent-V.git rodent
          cp rodent_bridge.go rodent/rodent_bridge.go

      - name: Cross-compile Rodent V for iOS arm64 -> librodent.a
        run: |
          SDK=$(xcrun -sdk iphoneos --show-sdk-path)
          cd rodent
          GOOS=ios GOARCH=arm64 CGO_ENABLED=1 \
            CC=$(xcrun -sdk iphoneos --find clang) \
            CGO_CFLAGS="-arch arm64 -isysroot $SDK -miphoneos-version-min=15.0" \
            CGO_LDFLAGS="-arch arm64 -isysroot $SDK -miphoneos-version-min=15.0" \
            go build -buildmode=c-archive -o librodent.a .
          file librodent.a
          echo "librodent.a: $(du -h librodent.a | cut -f1)"
          cp librodent.a ..
          cp librodent.h ..

      - name: Stage Rodent net + Nimzowitsch book for embedding
        run: |
          cp rodent/nets/rodent_4kb_768hl_8ob_v2.bin rodent_net.bin
          cp rodent/books/nimzowitsch.bin rodent_book.bin
          ls -la rodent_net.bin rodent_book.bin

      - name: Setup Theos
        uses: beerpiss/theos-action@v1
        with:
          cache: true

      - name: Build .deb
        run: make package FINALPACKAGE=1
        env:
          THEOS: ${{ github.workspace }}/theos

      - name: Publish .deb as release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          DEB=$(ls packages/*.deb | head -1)
          echo "built: $DEB"
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest "$DEB" \
            --title "Chess Assistant (rolling build)" \
            --notes "Rolling dev build. Rodent V engine with the Nimzoid personality." \
            --prerelease
          gh release upload v3.0.0 "$DEB" --clobber || true
